[project]
name = "vendor-ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faker>=40.36.0",
    "gradio>=6.26.0",
    "litellm>=1.97.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pyspark>=3.5.0,<4.0.0",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.0",
    "setuptools>=84.0.0",
    "tenacity>=9.1.4",
]

[project.scripts]
ingest-bronze = "vendor_ai_assistant.data_pipeline.bronze_ingestion:main"
ingest-knowledge-base = "vendor_ai_assistant.rag.ingest:main"
load-gold-sqlite = "vendor_ai_assistant.database_pipeline.load_gold_to_sqlite:main"
transform-gold = "vendor_ai_assistant.data_pipeline.gold_transformations:main"
transform-silver = "vendor_ai_assistant.data_pipeline.silver_transformations:main"
validate-sqlite-load = "vendor_ai_assistant.database_pipeline.validate_sqlite_load:main"
vendor-ai-assistant = "vendor_ai_assistant:main"
vendor-ai-ui = "vendor_ai_assistant.ui.app:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
